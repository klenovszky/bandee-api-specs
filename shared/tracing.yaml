openapi: 3.0.3
info:
  title: Bandee request tracing
  version: 2.0.0
paths: {}
components:
  schemas:
    TraceEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - sequence
        - spanId
        - operation
        - kind
        - elapsedUs
        - observedAt
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        spanId:
          type: string
          format: uuid
        parentSpanId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        phaseSpanId:
          type: string
          format: uuid
          description: Explicit owning phase within this trace; timestamps do not establish ownership.
        phaseSummary:
          $ref: '#/components/schemas/TracePhaseSummary'
        operation:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,95}$
          maxLength: 96
        kind:
          type: string
          enum:
            - START
            - END
            - MARKER
            - SKIPPED
            - LOSS
            - CLOSE
        elapsedUs:
          type: integer
          format: int64
          minimum: 0
        observedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
            - SUCCESS
            - ERROR
            - CANCELLED
            - UNKNOWN
        count:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        tokens:
          type: integer
          format: int64
          minimum: 0
        attempt:
          type: integer
          minimum: 0
        maxGapUs:
          type: integer
          format: int64
          minimum: 0
        code:
          type: string
          enum:
            - OPERATION_FAILED
            - CANCELLED
            - BUFFER_FULL
            - DELIVERY_FAILED
            - CLIENT_HIDDEN
            - NOT_REQUIRED
            - TIMEOUT
    TraceBatch:
      type: object
      additionalProperties: false
      required:
        - traceId
        - producerId
        - clockId
        - component
        - events
      properties:
        traceId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        producerId:
          type: string
          format: uuid
        clockId:
          type: string
          format: uuid
        component:
          type: string
          enum:
            - FRONTEND
            - NUXT
            - BACKEND
            - ASSISTANT
        build:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,80}$
          maxLength: 80
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TraceEvent'
    TraceReceipt:
      type: object
      additionalProperties: false
      required:
        - acknowledgedSequence
      properties:
        acknowledgedSequence:
          type: integer
          format: int64
          minimum: 0

    TraceCategoryTiming:
      type: object
      additionalProperties: false
      required: [category, exclusiveUs]
      properties:
        category:
          type: string
          enum: [CONFIGURATION, INPUT_BUILD, CAPABILITY_HTTP, TOKEN_HTTP, RESERVATION, DATABASE, SCHEDULING, TELEMETRY, FINALIZATION, PROVIDER_WAIT]
        exclusiveUs:
          type: integer
          format: int64
          minimum: 0
    TracePhaseSummary:
      type: object
      additionalProperties: false
      description: Cumulative same-clock accounting; use the latest revision, never sum revisions. Detail completeness is independent.
      required: [version, revision, phase, startUs, endUs, state, categories, unattributedUs, physicalStarted, physicalFinished, detailEvents, lostDetailEvents]
      properties:
        version:
          type: integer
          enum: [2]
        revision:
          type: integer
          format: int64
          minimum: 1
        phase:
          type: string
          enum: [PLANNING, EXECUTION, PUBLISHING, FINALIZATION]
        startUs:
          type: integer
          format: int64
          minimum: 0
        endUs:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum: [RUNNING, SUCCESS, ERROR, CANCELLED]
        categories:
          type: array
          maxItems: 14
          items:
            $ref: '#/components/schemas/TraceCategoryTiming'
        unattributedUs:
          type: integer
          format: int64
          minimum: 0
        physicalStarted:
          type: integer
          format: int64
          minimum: 0
        physicalFinished:
          type: integer
          format: int64
          minimum: 0
        detailEvents:
          type: integer
          format: int64
          minimum: 0
        lostDetailEvents:
          type: integer
          format: int64
          minimum: 0
