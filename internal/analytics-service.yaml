openapi: "3.0.3"
info:
  title: "Tantusz Internal Analytics API"
  version: "0.1.0"
servers:
  -
    url: "/api"
security:
  -
    internalBearer: []
components:
  schemas:
    AssistantError:
      "$ref": "../components/assistant.yaml#/schemas/AssistantError"
    AssistantContext:
      "$ref": "../components/assistant.yaml#/schemas/AssistantContext"
    AssistantConversationRequest:
      "$ref": "../components/assistant.yaml#/schemas/AssistantConversationRequest"
    AssistantConversation:
      "$ref": "../components/assistant.yaml#/schemas/AssistantConversation"
    AssistantConversationPage:
      "$ref": "../components/assistant.yaml#/schemas/AssistantConversationPage"
    AssistantMessageRequest:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessageRequest"
    AssistantMessageAccepted:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessageAccepted"
    AssistantEvidence:
      "$ref": "../components/assistant.yaml#/schemas/AssistantEvidence"
    AssistantTable:
      "$ref": "../components/assistant.yaml#/schemas/AssistantTable"
    AssistantChart:
      "$ref": "../components/assistant.yaml#/schemas/AssistantChart"
    AssistantAnswer:
      "$ref": "../components/assistant.yaml#/schemas/AssistantAnswer"
    AssistantMessage:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessage"
    AssistantMessagePage:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessagePage"
    AssistantRun:
      "$ref": "../components/assistant.yaml#/schemas/AssistantRun"
    AnalyticsPeriod:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsPeriod"
    AnalyticsQueryRequest:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryRequest"
    AnalyticsAccount:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsAccount"
    AnalyticsContextResponse:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsContextResponse"
    AnalyticsColumn:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsColumn"
    AnalyticsRow:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsRow"
    AnalyticsQueryResponse:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryResponse"
    AnalyticsTransactionSearchRequest:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransactionSearchRequest"
    AnalyticsTransaction:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransaction"
    AnalyticsTransactionPage:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransactionPage"
  securitySchemes:
    internalBearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: >-
        Backend-minted delegated token containing the authenticated user's subject
        and a mode claim of REAL or DEMO. The backend derives mode from the persisted
        assistant conversation; callers must not supply or override this claim.
paths:
  "/internal/analytics/context":
    get:
      operationId: "getAnalyticsContext"
      tags:
        - "Analytics"
      summary: "getAnalyticsContext"
      responses:
        "200":
          description: "Successful response"
          content:
            "application/json":
              schema:
                "$ref": "../components/analytics.yaml#/schemas/AnalyticsContextResponse"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "403":
          description: "Forbidden or invalid CSRF"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "409":
          description: "Conflict or changed data"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "429":
          description: "Usage limit"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "503":
          description: "Service unavailable"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
      security:
        -
          internalBearer: []
  "/internal/analytics/query":
    post:
      operationId: "queryAnalytics"
      tags:
        - "Analytics"
      summary: "queryAnalytics"
      responses:
        "200":
          description: "Successful response"
          content:
            "application/json":
              schema:
                "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryResponse"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "403":
          description: "Forbidden or invalid CSRF"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "409":
          description: "Conflict or changed data"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "429":
          description: "Usage limit"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "503":
          description: "Service unavailable"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryRequest"
      security:
        -
          internalBearer: []
  "/internal/analytics/transactions/search":
    post:
      operationId: "searchAnalyticsTransactions"
      tags:
        - "Analytics"
      summary: "searchAnalyticsTransactions"
      responses:
        "200":
          description: "Successful response"
          content:
            "application/json":
              schema:
                "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransactionPage"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "403":
          description: "Forbidden or invalid CSRF"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "409":
          description: "Conflict or changed data"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "429":
          description: "Usage limit"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "503":
          description: "Service unavailable"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransactionSearchRequest"
      security:
        -
          internalBearer: []
