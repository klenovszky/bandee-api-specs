openapi: 3.0.3
info:
  title: Bandee Chat V1 - Internal Assistant API
  version: 0.3.0
  description: Internal contract; no browser client generation. Private network plus
    mandatory shared service bearer authentication. No cookies, end-user IDs or prices
    are trusted here. Provider generation has no automatic retry at any layer. SSE
    transport is explicitly implemented and tested.
security:
- serviceBearer: [
    ]
tags:
- name: AiPreparation
- name: AiGeneration
- name: AiInternalStreams
paths:
  /internal/ai/capabilities:
    get:
      operationId: getModelCapabilities
      tags:
      - AiPreparation
      summary: Read the assistant's currently verified execution profile
      description: Returns the current unexpired profile without processing user
        content or invoking generation. A missing, expired, or unverifiable
        profile returns AI_UNAVAILABLE.
      parameters:
      - name: model
        in: query
        required: false
        description: Configured model identifier. If omitted, use the configured default model.
          Unknown or unverified models fail closed; no automatic model substitution occurs.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,200}$'
      responses:
        '200':
          description: Verified provider capabilities and application transport limits
          headers:
            Cache-Control:
              description: The response must not be stored by HTTP caches.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCapabilities'
        '401':
          description: Missing or invalid service authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No verified profile is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - serviceBearer: []
  /internal/ai/prepare:
    post:
      operationId: prepareGeneration
      tags:
      - AiPreparation
      summary: Validate and count tokens without generating
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedGeneration'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareGeneration'
      security:
      - serviceBearer: [
          ]
  /internal/ai/generations/{requestId}:
    post:
      operationId: dispatchGeneration
      tags:
      - AiInternalStreams
      summary: Consume one prepared plan and invoke the provider at most once per
        dispatch
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/InternalStreamEvent'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchGeneration'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Backend must durably reserve and claim dispatch before calling.
        Duplicate dispatch tokens or a reused plan never invoke the provider again;
        return 409/status evidence. Commit process-local provider boundary before
        SDK invocation. Unknown transport results are never automatically replayed.
        Cancellation tries to stop provider execution; usage may be absent and cost
        uncertain.
      security:
      - serviceBearer: [
          ]
    get:
      operationId: getGenerationStatus
      tags:
      - AiGeneration
      summary: Read process-local execution evidence
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatus'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - { name: X-Dispatch-Token, in: header, required: false, schema: { type: string, format: uuid } }
      - { name: X-Assistant-Instance-ID, in: header, required: false, schema: { type: string, format: uuid } }
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - serviceBearer: [
          ]
    delete:
      operationId: cancelGeneration
      tags:
      - AiGeneration
      summary: Request cancellation without assuming zero cost
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatus'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - { name: X-Dispatch-Token, in: header, required: false, schema: { type: string, format: uuid } }
      - { name: X-Assistant-Instance-ID, in: header, required: false, schema: { type: string, format: uuid } }
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - serviceBearer: [
          ]
  /internal/ai/generations/{requestId}/detach:
    post:
      operationId: detachGeneration
      tags: [AiGeneration]
      summary: Keep the original bounded execution alive for content-free final usage
      description: Authenticated opt-in after durable user Stop. Idempotent for the same
        request, dispatch token and assistant instance. Acknowledgement allows provider
        execution to survive internal transport loss until its ORIGINAL deadline and
        limits. Discard all subsequent content, retain final usage until deadline plus
        ten minutes. No new invocation, deadline extension or capacity exemption.
        A restart loses process-local evidence; absent evidence never proves zero cost.
      parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: X-Dispatch-Token, in: header, required: true, schema: { type: string, format: uuid } }
      - { name: X-Assistant-Instance-ID, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Original execution detached, or its retained terminal evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationStatus' }
        '401':
          description: Service authentication required
        '404':
          description: Original execution not present
        '409':
          description: Dispatch or instance mismatch
      security:
      - serviceBearer: []
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    ModelCapabilities:
      type: object
      additionalProperties: false
      description: A versioned snapshot for one configured model and LOW thinking.
        Each execution limit must be verified independently. The backend additionally
        applies its own lower transport limits and owns prices and monetary policy.
      required:
      - schemaVersion
      - profileHash
      - model
      - modelRevision
      - providerInputTokenLimit
      - providerOutputTokenLimit
      - maxInputTokens
      - maxOutputTokens
      - billableOutputTokenUpperBound
      - thinkingMode
      - maxPrepareRequestBytes
      - maxGeneratedTextBytes
      - verifiedAt
      - expiresAt
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        profileHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase SHA-256 over RFC 8785 canonical JSON of all
            other properties in this object. Omit absent optional properties.
        model:
          type: string
        modelRevision:
          type: string
        providerInputTokenLimit:
          type: integer
          minimum: 1
        providerOutputTokenLimit:
          type: integer
          minimum: 1
        providerCombinedTokenLimit:
          type: integer
          minimum: 1
          description: Include only when the provider's combined input/output
            constraint has been verified for this model and endpoint.
        maxInputTokens:
          type: integer
          minimum: 1
          description: Maximum counted input accepted by the application profile.
        maxOutputTokens:
          type: integer
          minimum: 1
          description: Largest output setting accepted by the application profile.
        billableOutputTokenUpperBound:
          type: integer
          format: int64
          minimum: 1
          description: Conservative upper bound on all billed output and thinking
            tokens together, for any output setting allowed by this profile.
        thinkingMode:
          type: string
          enum: [LOW]
        maxPrepareRequestBytes:
          type: integer
          minimum: 1
          description: Maximum UTF-8 JSON body size for preparation in bytes.
        maxGeneratedTextBytes:
          type: integer
          minimum: 1
          description: Maximum aggregate UTF-8 generated text size per dispatch in bytes.
        verifiedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - INVALID_INPUT
          - IDEMPOTENCY_CONFLICT
          - USER_BUSY
          - STREAM_BUSY
          - STREAM_REQUIRED
          - RETRY_NOT_ALLOWED
          - RESOURCE_LIMIT
          - BUDGET_UNAVAILABLE
          - AI_UNAVAILABLE
          - CONTEXT_TOO_LARGE
          - PROVIDER_FAILURE
          - OUTCOME_UNCERTAIN
          - REQUEST_EXPIRED
          - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
          format: uuid
        retryAllowed:
          type: boolean
      required:
      - code
      - message
      - retryAllowed
    ExecutionState:
      type: string
      enum:
      - AWAITING_STREAM
      - PREPARING
      - DISPATCHING
      - STREAMING
      - CANCEL_REQUESTED
      - COMPLETED
      - FAILED
      - CANCELLED
      - INTERRUPTED
      - UNKNOWN
    ContextMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - SYSTEM
          - USER
          - ASSISTANT
        content:
          type: string
      required:
      - role
      - content
    PrepareGeneration:
      type: object
      additionalProperties: false
      properties:
        automaticStep:
          $ref: '#/components/schemas/AutomaticStepContext'
        routingContext:
          $ref: '#/components/schemas/RoutingContext'
        analysisStep:
          $ref: '#/components/schemas/AnalysisStepContext'
        responseLanguage:
          $ref: '../services/chat-v1.yaml#/components/schemas/ResponseLanguage'
        requestId:
          type: string
          format: uuid
        model:
          type: string
        systemPromptVersion:
          type: string
        contextHash:
          type: string
        profileHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Required for capability-aware callers. The assistant must
            reject an expired or mismatched profile before token counting.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContextMessage'
        maxOutputTokens:
          type: integer
          minimum: 1
        thinkingMode:
          type: string
        deadline:
          type: string
          format: date-time
      required:
      - responseLanguage
      - requestId
      - model
      - systemPromptVersion
      - contextHash
      - messages
      - maxOutputTokens
      - thinkingMode
      - deadline
      description: Token counting and validation only, never generation. Context hash
        is SHA-256 over RFC 8785 canonical JSON of model, systemPromptVersion, messages,
        maxOutputTokens, thinkingMode, responseLanguage, profileHash, analysisStep
        and routingContext/automaticStep when supplied. Absent optional fields preserve the previous hash protocol.
        The plan binds these exact values. Enforce
        size and deadline limits; tools/caching/multiple candidates are forbidden
        in V1. The backend supplies a SYSTEM message selecting this language before
        token counting; the assistant validates the language instruction and retains
        the exact prepared messages for dispatch. Never append an uncounted language
        instruction at generation time. Language is fixed for this request; switching
        the GUI cannot alter an accepted plan or active generation.
        analysisStep is server-supplied correlation for one DRIVE_ANALYSIS_STEP
        child; requestId must differ from parentRequestId. It requires an unexpired
        profileHash, binds the exact prepared plan and must be echoed unchanged in
        the preparation response and dispatch. It never authorizes another call,
        independent tool use or automatic retry. The assistant runs one physical
        call and does not orchestrate the workflow. Intermediate output is validated
        by the backend and is never treated as voice review or a conversation title.
    PreparedGeneration:
      type: object
      additionalProperties: false
      properties:
        automaticStep:
          $ref: '#/components/schemas/AutomaticStepContext'
        routingContext:
          $ref: '#/components/schemas/RoutingContext'
        analysisStep:
          $ref: '#/components/schemas/AnalysisStepContext'
        planToken:
          type: string
        contextHash:
          type: string
        profileHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Echo the exact verified profile when supplied at preparation.
            Its expiry also limits the lifetime of the dispatch plan.
        modelRevision:
          type: string
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        billableOutputTokenUpperBound:
          type: integer
          format: int64
          minimum: 0
        boundKind:
          type: string
          enum:
          - VERIFIED_MODEL_LIMIT
        expiresAt:
          type: string
          format: date-time
      required:
      - planToken
      - contextHash
      - modelRevision
      - inputTokens
      - billableOutputTokenUpperBound
      - boundKind
      - expiresAt
      description: 'Opaque, single-use, process-local prepared plan expires within
        30 seconds. Assistant restart invalidates it before any provider call. Counting
        must be exact or a documented conservative upper bound. Failure to prove the
        billable output/thinking bound returns AI_UNAVAILABLE. No price authority:
        backend owns prices and money.'
    DispatchGeneration:
      type: object
      additionalProperties: false
      properties:
        automaticStep:
          $ref: '#/components/schemas/AutomaticStepContext'
        routingContext:
          $ref: '#/components/schemas/RoutingContext'
        analysisStep:
          $ref: '#/components/schemas/AnalysisStepContext'
        dispatchToken:
          type: string
          format: uuid
        planToken:
          type: string
        contextHash:
          type: string
        deadline:
          type: string
          format: date-time
      required:
      - dispatchToken
      - planToken
      - contextHash
      - deadline
      description: >-
        routingContext and analysisStep must be present exactly when supplied during preparation
        and match every field. The plan token and context hash bind it as well as the
        selected output size and profile. Mismatch is rejected before provider
        invocation. Dispatch retains its existing single-use/no-retry semantics.
    AutomaticStepContext:
      type: object
      additionalProperties: false
      required: [parentRequestId, planHash, nodeHash, ordinal, kind, modelConfigHash]
      description: Trusted backend correlation for one automatic chat child. Mutually exclusive with routingContext and analysisStep. Requires profileHash; requestId differs from parentRequestId. Included in canonical context hash, echoed unchanged in preparation and dispatch. One prepared call only, no tools, retries or workflow orchestration. CHAT uses auto-plan-chat-v1, document nodes use drive-analysis-v2. LEAF/MERGE outputs are buffered and strictly validated by the backend before reuse.
      properties:
        parentRequestId: { type: string, format: uuid }
        planHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        nodeHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        modelConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        ordinal: { type: integer, format: int64, minimum: 0 }
        kind: { type: string, enum: [CHAT, DIRECT, LEAF, MERGE, FINAL] }
    RoutingContext:
      type: object
      additionalProperties: false
      required: [parentRequestId, modelConfigHash, historyHash]
      description: >-
        Trusted backend correlation for one internal routing child. Requires
        profileHash and systemPromptVersion routing-json-v2; mutually exclusive with
        analysisStep. The child requestId differs from parentRequestId. Included
        in the canonical context hash, frozen at preparation and echoed in the
        preparation response and dispatch. Dispatch must match every field.
        No browser routing endpoint or authorization is introduced. The model
        receives only the already counted messages, never this metadata as an
        additional prompt. Old calls omit routingContext and retain their hash.
        A routing response is one strict RoutingDecision JSON object, buffered
        and validated before any delta is exposed. No tools or repair retry.
        The provider is configured for schema-constrained JSON matching the
        generated RoutingDecision contract. Token counting includes that schema
        and the same invocation settings used by generation. Legacy routing-v1
        preparation is rejected before token counting or generation.
      properties:
        parentRequestId: { type: string, format: uuid }
        modelConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        historyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    RoutingDecision:
      type: object
      additionalProperties: false
      required: [route, documentNeed, coverageNeed, scope]
      description: >-
        Untrusted model proposal, validated and resolved by the backend. It cannot
        select arbitrary files, grant permissions, execute tools or set prices.
        Uncertainty is handled by conservative server-side routing and scope,
        never a user mode/scope choice or a per-request cost confirmation.
        Relevant results do not prove complete coverage. Protocol errors stop
        without a paid repair call. No free-text reasoning or confidence score.
      properties:
        route: { type: string, enum: [NO_DOCUMENTS, RELEVANT_SEARCH, FULL_SCOPE, UNCERTAIN] }
        documentNeed: { type: string, enum: [NONE, REQUIRED, UNCERTAIN] }
        coverageNeed: { type: string, enum: [TARGETED, COMPLETE, UNCERTAIN] }
        scope: { type: string, enum: [AUTHORIZED_ROOT, PRIOR_SCOPE, UNCERTAIN] }
    AnalysisStepContext:
      type: object
      additionalProperties: false
      required: [analysisId, parentRequestId, planVersion, nodeKey, kind]
      description: >-
        Trusted backend correlation, not browser input or authorization. One
        analysis/planVersion/nodeKey maps to one durable child request and dispatch.
        A replay cannot replace the child or invoke the provider again. Metadata is
        not appended to the model prompt after token counting. No document text,
        file names, end-user identity, price or credential belongs in this object.
      properties:
        analysisId: { type: string, format: uuid }
        parentRequestId: { type: string, format: uuid }
        planVersion: { type: integer, format: int64, minimum: 1 }
        nodeKey: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$' }
        kind: { type: string, enum: [DIRECT, LEAF, MERGE, FINAL] }
    ProviderUsage:
      type: object
      additionalProperties: false
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        thinkingTokens:
          type: integer
          format: int64
          minimum: 0
        cachedInputTokens:
          type: integer
          format: int64
          minimum: 0
        providerRequestId:
          type: string
        modelRevision:
          type: string
        complete:
          type: boolean
      required:
      - inputTokens
      - outputTokens
      - thinkingTokens
      - cachedInputTokens
      - modelRevision
      - complete
      description: Normalized non-overlapping billable categories. outputTokens excludes
        separately reported thinkingTokens. Adapter must verify raw provider semantics;
        never subtract an unverified field or treat missing usage as zero. complete=true
        only for authoritative final usage. Prices are backend-owned.
    GenerationStatus:
      type: object
      additionalProperties: false
      properties:
        detached:
          type: boolean
          default: false
        evidenceExpiresAt:
          type: string
          format: date-time
          description: Original deadline plus ten minutes; expired usage is omitted.
        requestId:
          type: string
          format: uuid
        dispatchToken:
          type: string
          format: uuid
        assistantInstanceId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - ACCEPTED
          - PROVIDER_INVOKED
          - STREAMING
          - COMPLETED
          - FAILED
          - CANCEL_REQUESTED
          - CANCELLED
          - UNKNOWN
        providerInvoked:
          type: boolean
        executionConfirmedEnded:
          type: boolean
        usage:
          $ref: '#/components/schemas/ProviderUsage'
      required:
      - requestId
      - dispatchToken
      - assistantInstanceId
      - state
      - providerInvoked
      - executionConfirmedEnded
      description: Process-local evidence only. Missing entry/404 after assistant
        restart proves nothing about an earlier provider invocation. No prompt or
        response text is returned. Execution completion and final usage completeness
        are independent.
    InternalStreamEvent:
      description: SSE name equals type and JSON data uses this envelope. All events
        bind the durable dispatch token and assistant process ID. delta requires delta.
        Terminal events carry executionConfirmedEnded and usage only if authoritative.
        A failed event before provider invocation must explicitly confirm no invocation;
        otherwise backend stays conservative. Do not forward raw SDK exceptions. Terminal
        events require providerInvoked and executionConfirmedEnded. accepted/provider-invoked
        events report the corresponding boundary explicitly.
      oneOf:
      - $ref: '#/components/schemas/InternalAcceptedEvent'
      - $ref: '#/components/schemas/InternalProviderInvokedEvent'
      - $ref: '#/components/schemas/InternalDeltaEvent'
      - $ref: '#/components/schemas/InternalCompletedEvent'
      - $ref: '#/components/schemas/InternalFailedEvent'
      - $ref: '#/components/schemas/InternalCancelledEvent'
      - $ref: '#/components/schemas/InternalHeartbeatEvent'
      discriminator:
        propertyName: type
        mapping:
          accepted: '#/components/schemas/InternalAcceptedEvent'
          provider-invoked: '#/components/schemas/InternalProviderInvokedEvent'
          delta: '#/components/schemas/InternalDeltaEvent'
          completed: '#/components/schemas/InternalCompletedEvent'
          failed: '#/components/schemas/InternalFailedEvent'
          cancelled: '#/components/schemas/InternalCancelledEvent'
          heartbeat: '#/components/schemas/InternalHeartbeatEvent'
    InternalAcceptedEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - accepted
        requestId:
          type: string
          format: uuid
        dispatchToken:
          type: string
          format: uuid
        assistantInstanceId:
          type: string
          format: uuid
        providerInvoked:
          type: boolean
      required:
      - type
      - requestId
      - dispatchToken
      - assistantInstanceId
      - providerInvoked
    InternalProviderInvokedEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - provider-invoked
        requestId:
          type: string
          format: uuid
        dispatchToken:
          type: string
          format: uuid
        assistantInstanceId:
          type: string
          format: uuid
        providerInvoked:
