openapi: "3.0.3"
info:
  title: "Tantusz Assistant API"
  description: "REST API specification for the Tantusz assistant service."
  version: "0.0.1-SNAPSHOT"
paths:
  /internal/ai/prepare:
    $ref: "./chat-v1.yaml#/paths/~1internal~1ai~1prepare"
  /internal/ai/generations/{requestId}:
    $ref: "./chat-v1.yaml#/paths/~1internal~1ai~1generations~1{requestId}"
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    ResponseLanguage:
      $ref: "../services/chat-v1.yaml#/components/schemas/ResponseLanguage"
    Problem:
      $ref: "./chat-v1.yaml#/components/schemas/Problem"
    ExecutionState:
      $ref: "./chat-v1.yaml#/components/schemas/ExecutionState"
    ContextMessage:
      $ref: "./chat-v1.yaml#/components/schemas/ContextMessage"
    PrepareGeneration:
      $ref: "./chat-v1.yaml#/components/schemas/PrepareGeneration"
    PreparedGeneration:
      $ref: "./chat-v1.yaml#/components/schemas/PreparedGeneration"
    DispatchGeneration:
      $ref: "./chat-v1.yaml#/components/schemas/DispatchGeneration"
    ProviderUsage:
      $ref: "./chat-v1.yaml#/components/schemas/ProviderUsage"
    GenerationStatus:
      $ref: "./chat-v1.yaml#/components/schemas/GenerationStatus"
    InternalStreamEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalStreamEvent"
    InternalAcceptedEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalAcceptedEvent"
    InternalProviderInvokedEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalProviderInvokedEvent"
    InternalDeltaEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalDeltaEvent"
    InternalCompletedEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalCompletedEvent"
    InternalFailedEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalFailedEvent"
    InternalCancelledEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalCancelledEvent"
    InternalHeartbeatEvent:
      $ref: "./chat-v1.yaml#/components/schemas/InternalHeartbeatEvent"
