openapi: "3.0.3"
info:
  title: "Tantusz Assistant API"
  description: "REST API specification for the Tantusz assistant service."
  version: "0.0.1-SNAPSHOT"
paths:
  /api/hello:
    get:
      summary: "Hello World endpoint"
      description: "Egyszerű tesztvégpont, ami üdvözlő üzenetet ad vissza."
      operationId: "getHello"
      responses:
        "200":
          description: "Sikeres válasz"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Hello from Tantusz Assistant"
