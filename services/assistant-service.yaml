openapi: "3.0.3"
info:
  title: "Tantusz Assistant API"
  version: "0.1.0"
  description: "User-owned financial conversations. Browser calls use the existing BFF session and CSRF. Service consumers use an internal bearer-token wrapper."
servers:
  -
    url: "/api"
security:
  -
    sessionCookie: []
components:
  schemas:
    AssistantError:
      "$ref": "../components/assistant.yaml#/schemas/AssistantError"
    AssistantContext:
      "$ref": "../components/assistant.yaml#/schemas/AssistantContext"
    AssistantConversationRequest:
      "$ref": "../components/assistant.yaml#/schemas/AssistantConversationRequest"
    AssistantConversation:
      "$ref": "../components/assistant.yaml#/schemas/AssistantConversation"
    AssistantConversationPage:
      "$ref": "../components/assistant.yaml#/schemas/AssistantConversationPage"
    AssistantMessageRequest:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessageRequest"
    AssistantMessageAccepted:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessageAccepted"
    AssistantEvidence:
      "$ref": "../components/assistant.yaml#/schemas/AssistantEvidence"
    AssistantTable:
      "$ref": "../components/assistant.yaml#/schemas/AssistantTable"
    AssistantChart:
      "$ref": "../components/assistant.yaml#/schemas/AssistantChart"
    AssistantAnswer:
      "$ref": "../components/assistant.yaml#/schemas/AssistantAnswer"
    AssistantMessage:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessage"
    AssistantMessagePage:
      "$ref": "../components/assistant.yaml#/schemas/AssistantMessagePage"
    AssistantRun:
      "$ref": "../components/assistant.yaml#/schemas/AssistantRun"
    AnalyticsPeriod:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsPeriod"
    AnalyticsQueryRequest:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryRequest"
    AnalyticsAccount:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsAccount"
    AnalyticsContextResponse:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsContextResponse"
    AnalyticsColumn:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsColumn"
    AnalyticsRow:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsRow"
    AnalyticsQueryResponse:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryResponse"
    AnalyticsTransactionSearchRequest:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransactionSearchRequest"
    AnalyticsTransaction:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransaction"
    AnalyticsTransactionPage:
      "$ref": "../components/analytics.yaml#/schemas/AnalyticsTransactionPage"
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "SESSION"
paths:
  "/assistant/conversations":
    post:
      operationId: "createAssistantConversation"
      tags:
        - "Assistant"
      summary: "createAssistantConversation"
      responses:
        "201":
          description: "Successful response"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantConversation"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "403":
          description: "Forbidden or invalid CSRF"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "409":
          description: "Conflict or changed data"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "429":
          description: "Usage limit"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "503":
          description: "Service unavailable"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "../components/assistant.yaml#/schemas/AssistantConversationRequest"
    get:
      operationId: "listAssistantConversations"
      tags:
        - "Assistant"
      summary: "listAssistantConversations"
      responses:
        "200":
          description: "Successful response"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantConversationPage"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "403":
          description: "Forbidden or invalid CSRF"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "409":
          description: "Conflict or changed data"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "429":
          description: "Usage limit"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
        "503":
          description: "Service unavailable"
          content:
            "application/json":
              schema:
                "$ref": "../components/assistant.yaml#/schemas/AssistantError"
      parameters:
        -
          name: "mode"
          in: "query"
          required: false
          description: "Selects conversations for this bank-data mode; omitted values use REAL."
          schema:
            type: "string"
            enum:
              - "REAL"
              - "DEMO"
            default: "REAL"
        -
          name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 100
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 50
            default: 20
