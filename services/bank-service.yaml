openapi: 3.0.3
info:
  title: Tantusz Authentication and Bank Service API
  description: >-
    Google sign-in and user-owned Open Banking integration. Browser requests use an
    HttpOnly SESSION cookie. Read /auth/csrf before state-changing requests and send
    its token in the returned headerName (X-CSRF-TOKEN by default). Re-fetch the
    token after signing in or out. Bank data is always scoped to the signed-in user.
  version: 0.0.1-SNAPSHOT

servers:
  - url: /api
    description: Same-origin frontend proxy or production reverse proxy

security:
  - sessionCookie: []

components:
  schemas:
    BankConnectionResponse:
      $ref: '../components/components.yaml#/schemas/BankConnectionResponse'
    BankAccountResponse:
      $ref: '../components/components.yaml#/schemas/BankAccountResponse'
    DemoBankResponse:
      type: object
      required:
        - connection
        - account
      properties:
        connection:
          $ref: '#/components/schemas/BankConnectionResponse'
        account:
          $ref: '#/components/schemas/BankAccountResponse'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly server-side session established by Google sign-in.

paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user
      tags:
        - Auth
      responses:
        '200':
          description: Current Google user profile
          content:
            application/json:
              schema:
                $ref: '../components/components.yaml#/schemas/CurrentUserResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'

  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get a CSRF token for this browser session
      description: Available before sign-in. Refresh the token after sign-in and logout.
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: CSRF token and request header name
          content:
            application/json:
              schema:
                $ref: '../components/components.yaml#/schemas/CsrfResponse'

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out of Tantusz
      description: Requires the CSRF header returned by /auth/csrf and invalidates the current session.
      tags:
        - Auth
      responses:
        '204':
          description: Session invalidated and session cookie cleared
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'

  /oauth2/authorization/google:
    get:
      operationId: startGoogleLogin
      summary: Start Google sign-in in the browser
      description: Navigate the browser to this URL. Do not call it with fetch or the API client.
      tags:
        - Auth
      security: []
      responses:
        '302':
          description: Browser redirect to Google authorization
          headers:
            Location:
              schema:
                type: string
                format: uri

  /login/oauth2/code/google:
    get:
      operationId: completeGoogleLogin
      summary: Complete Google sign-in
      description: >-
        Browser callback handled entirely by Spring Security. The browser is redirected
        to the configured frontend /auth/callback route; do not call this endpoint from
        the generated API client or implement a parallel controller.
      tags:
        - Auth
      security: []
      responses:
        '302':
          description: Browser redirect to the configured frontend auth callback
          headers:
            Location:
              schema:
                type: string
                format: uri

  /banks/aspsps:
    get:
      operationId: getAspsps
      summary: List available banks / ASPSPs
      description: Returns the list of supported ASPSPs (banks) in the requested country (defaults to HU).
      tags:
        - Banks
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
            default: "HU"
          description: ISO 3166-1 alpha-2 country code
      responses:
        '200':
          description: List of ASPSPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/components.yaml#/schemas/AspspResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'

  /banks/demo:
    post:
      operationId: createDemoBank
      summary: Create or return the signed-in user's demo bank data
      description: >-
        Idempotently ensures that this signed-in user has one synthetic demo bank
        connection and account with generated transactions. Repeated requests return
        the existing demo data without regenerating it. This endpoint performs no
        external bank authorization, token exchange, or synchronization. Requires the
        CSRF header returned by /auth/csrf.
      tags:
        - Banks
      responses:
        '200':
          description: Existing or newly created demo connection and account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoBankResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'

  /banks/auth:
    post:
      operationId: startBankAuth
      summary: Start bank authorization flow
      description: >-
        Generates a single-use authorization link bound to the current user and
        browser session. Requires the CSRF header returned by /auth/csrf.
      tags:
        - Banks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/components.yaml#/schemas/BankAuthRequest'
      responses:
        '200':
          description: Bank authorization URL generated
          content:
            application/json:
              schema:
                $ref: '../components/components.yaml#/schemas/BankAuthResponse'
        '400':
          description: Invalid bank request or redirectUrl differs from the configured callback URL
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'

  /banks/callback:
    get:
      operationId: handleBankCallback
      summary: Handle bank OAuth callback redirect
      description: >-
        Validates and consumes the pending state against the existing authenticated
        browser session before exchanging the authorization code. This route is
        available without API authentication only to return a controlled frontend
        redirect; it never creates a replacement session. Ownership comes from the
        pending authorization, never a request user ID. The redirect uses status=success
        with connectionId, or status=error with a sanitized error code.
      tags:
        - Banks
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code returned by the ASPSP
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: State passed during auth initiation; missing or invalid state is rejected safely.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Authorization error reported by the provider
        - name: error_description
          in: query
          required: false
          schema:
            type: string
          description: Optional provider error details; not included in the frontend redirect
      responses:
        '302':
          description: Browser redirect to the configured frontend callback on success or failure, including when callback parameters are missing
          headers:
            Location:
              schema:
                type: string
                format: uri

  /banks/connections:
    get:
      operationId: getBankConnections
      summary: List the current user's bank connections
      description: Returns the signed-in user's active and historic bank connections.
      tags:
        - Banks
      parameters:
        - name: mode
          in: query
          required: false
          description: Selects real or demo bank data; omitted values use REAL.
          schema:
            type: string
            enum:
              - REAL
              - DEMO
            default: REAL
      responses:
        '200':
          description: List of bank connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankConnectionResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'

  /banks/connections/{connectionId}:
    delete:
      operationId: deleteBankConnection
      summary: Delete a bank connection
      description: >-
        Deletes the current user's bank connection and associated data.
        Requires the CSRF header returned by /auth/csrf.
      tags:
        - Banks
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Bank connection deleted
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'
        '404':
          $ref: '../components/components.yaml#/responses/ResourceNotFound'

  /banks/accounts:
    get:
      operationId: getBankAccounts
      summary: List bank accounts
      description: Returns only the signed-in user's connected bank accounts and current balances.
      tags:
        - Banks
      parameters:
        - name: connectionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter accounts by bank connection ID
        - name: mode
          in: query
          required: false
          description: Selects real or demo bank data; omitted values use REAL.
          schema:
            type: string
            enum:
              - REAL
              - DEMO
            default: REAL
      responses:
        '200':
          description: List of bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankAccountResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '404':
          $ref: '../components/components.yaml#/responses/ResourceNotFound'

  /banks/accounts/{accountId}/sync:
    post:
      operationId: syncBankAccount
      summary: Synchronize account balances and transactions
      description: >-
        Fetches the latest balance and transactions for the current user's account.
        Requires the CSRF header returned by /auth/csrf.
      tags:
        - Banks
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account synchronization completed
          content:
            application/json:
              schema:
                $ref: '../components/components.yaml#/schemas/BankSyncResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'
        '404':
          $ref: '../components/components.yaml#/responses/ResourceNotFound'

  /banks/iban:
    get:
      operationId: getUserIban
      summary: Get the user's stored IBAN
      description: Returns the IBAN number associated with the current user.
      tags:
        - Banks
      responses:
        '200':
          description: User's IBAN number
          content:
            application/json:
              schema:
                type: object
                properties:
                  iban:
                    type: string
                    example: "HU42117730161111222233334444"
        '204':
          description: No IBAN stored for the user
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
    put:
      operationId: setUserIban
      summary: Store or update the user's IBAN
      description: Stores or updates the IBAN number associated with the current user. Requires the CSRF header returned by /auth/csrf.
      tags:
        - Banks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/components.yaml#/schemas/IbanRequest'
      responses:
        '204':
          description: IBAN stored successfully
        '400':
          description: Invalid IBAN format
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'
    delete:
      operationId: deleteUserIban
      summary: Delete the user's stored IBAN
      description: Removes the IBAN number associated with the current user. Requires the CSRF header returned by /auth/csrf. Cannot delete if the user has active bank connections.
      tags:
        - Banks
      responses:
        '204':
          description: IBAN deleted successfully
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '403':
          $ref: '../components/components.yaml#/responses/InvalidCsrfToken'
        '409':
          description: Cannot delete IBAN while bank connections exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Nem törölhető az IBAN, mert van kapcsolt bankszámla. Először válaszd le a bankot."

  /banks/transactions:
    get:
      operationId: getBankTransactions
      summary: List bank transactions
      description: Returns only the current user's transactions, optionally filtered by account and booking dates.
      tags:
        - Banks
      parameters:
        - name: mode
          in: query
          required: false
          description: Selects real or demo bank data; omitted values use REAL.
          schema:
            type: string
            enum:
              - REAL
              - DEMO
            default: REAL
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by account ID
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by start booking date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by end booking date
      responses:
        '200':
          description: List of bank transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/components.yaml#/schemas/BankTransactionResponse'
        '401':
          $ref: '../components/components.yaml#/responses/Unauthenticated'
        '404':
          $ref: '../components/components.yaml#/responses/ResourceNotFound'
