openapi: "3.0.3"
info:
  title: "Tantusz Backend API"
  description: "REST API specification for the Tantusz backend service."
  version: "0.0.1-SNAPSHOT"
paths:
  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Read the current browser session
      description: Public endpoint. Never cached. Authentication uses an HttpOnly same-origin session cookie.
      responses:
        "200":
          description: Authentication availability and current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrf
      summary: Obtain a session-bound CSRF token before a state-changing request
      responses:
        "200":
          description: Send the token in the named header, including on logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the browser session
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session invalidated and cookie deleted }
        "403": { description: Missing or invalid CSRF token }
  /api/oauth2/authorization/google:
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      summary: Navigate the browser here to start Google OpenID Connect login
      description: Only openid, email and profile scopes. The backend validates state, nonce, issuer, signature and audience. Any Google account with a verified email address may sign in and receives its own Tantusz user identity. Disabled Tantusz users remain blocked.
      responses:
        "302": { description: Redirect to Google }
        "404": { description: Google login is not configured }
  /api/login/oauth2/code/google:
    get:
      tags: [Auth]
      operationId: googleCallback
      summary: Google authorization-code callback handled by Spring Security
      description: Success redirects to the configured frontend origin. Failure redirects there with login=failed and no provider details. Session cookies are HttpOnly and SameSite=Lax; HTTPS deployments require Secure.
      responses:
        "302": { description: Redirect to the frontend }
  /api/hello:
    get:
      summary: "Hello World endpoint"
      description: "Egyszerű tesztvégpont, ami üdvözlő üzenetet ad vissza."
      operationId: "getHello"
      responses:
        "200":
          description: "Sikeres válasz"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
  /api/chat/conversations:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1conversations"
  /api/chat/conversations/{conversationId}:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1conversations~1{conversationId}"
  /api/chat/conversations/{conversationId}/messages:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1conversations~1{conversationId}~1messages"
  /api/chat/conversations/{conversationId}/requests:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1conversations~1{conversationId}~1requests"
  /api/chat/requests/{requestId}:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1requests~1{requestId}"
  /api/chat/requests/{requestId}/stream:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1requests~1{requestId}~1stream"
  /api/chat/requests/{requestId}/start:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1requests~1{requestId}~1start"
  /api/chat/requests/{requestId}/cancel:
    $ref: "./chat-v1.yaml#/paths/~1api~1chat~1requests~1{requestId}~1cancel"
  /api/ai/budget:
    $ref: "./chat-v1.yaml#/paths/~1api~1ai~1budget"
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: TANTUSZ_SESSION
  schemas:
    ExecutionState:
      $ref: "./chat-v1.yaml#/components/schemas/ExecutionState"
    AccountingState:
      $ref: "./chat-v1.yaml#/components/schemas/AccountingState"
    Problem:
      $ref: "./chat-v1.yaml#/components/schemas/Problem"
    Conversation:
      $ref: "./chat-v1.yaml#/components/schemas/Conversation"
    Message:
      $ref: "./chat-v1.yaml#/components/schemas/Message"
    RequestStatus:
      $ref: "./chat-v1.yaml#/components/schemas/RequestStatus"
    OwnBudget:
      $ref: "./chat-v1.yaml#/components/schemas/OwnBudget"
    CreateRequest:
      $ref: "./chat-v1.yaml#/components/schemas/CreateRequest"
    PublicStreamEvent:
      $ref: "./chat-v1.yaml#/components/schemas/PublicStreamEvent"
    ConversationPage:
      $ref: "./chat-v1.yaml#/components/schemas/ConversationPage"
    MessagePage:
      $ref: "./chat-v1.yaml#/components/schemas/MessagePage"
    PublicReadyEvent:
      $ref: "./chat-v1.yaml#/components/schemas/PublicReadyEvent"
    PublicStatusEvent:
      $ref: "./chat-v1.yaml#/components/schemas/PublicStatusEvent"
    PublicDeltaEvent:
      $ref: "./chat-v1.yaml#/components/schemas/PublicDeltaEvent"
    PublicTerminalEvent:
      $ref: "./chat-v1.yaml#/components/schemas/PublicTerminalEvent"
    CreateNewTurn:
      $ref: "./chat-v1.yaml#/components/schemas/CreateNewTurn"
    RetryTurn:
      $ref: "./chat-v1.yaml#/components/schemas/RetryTurn"
    AuthSession:
      type: object
      required: [enabled, authenticated]
      properties:
        enabled: { type: boolean }
        authenticated: { type: boolean }
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        picture:
          type: string
          format: uri
          description: Optional HTTPS profile picture URL from the current verified Google session. Not stored in the database.
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName: { type: string }
        token: { type: string }
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Hello from Tantusz"
