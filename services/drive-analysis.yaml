openapi: 3.0.3
info:
  title: Bandee Drive Analysis - Browser API
  version: 0.1.0
  description: >-
    Durable analysis of an explicitly captured Drive scope. Every operation checks
    the session owner, active account, connection generation and current consent.
    IDs, cursors and hashes are not authorization. Responses use Cache-Control:
    no-store. Reads never start or resume provider work. Internal child requests,
    intermediate text and provider identifiers are never exposed as chat turns.
security:
  - browserSession: []
tags:
  - name: DriveAnalyses
paths:
  /api/chat/requests/{requestId}/analysis:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getDriveAnalysis
      tags: [DriveAnalyses]
      summary: Read the owned parent analysis, current scope, plan and progress
      description: >-
        Returns 404 for a foreign, deleted or non-analysis request. Does not
        acquire a running slot, refresh a quote, count tokens or dispatch work.
      responses:
        '200':
          description: Current durable analysis status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveAnalysisStatus' }
        default: { $ref: '#/components/responses/AnalysisProblem' }
  /api/chat/requests/{requestId}/analysis/documents:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listDriveAnalysisDocuments
      tags: [DriveAnalyses]
      summary: Page through the captured manifest, including unprocessed documents
      description: >-
        Stable keyset order within a scope version. Cursor binds the owner,
        parent, scope version and last document; a superseded cursor returns
        DRIVE_ANALYSIS_PLAN_CHANGED. The first page is not a scope limit.
        Counts never silently drop pending, skipped, failed or invalidated files.
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: One bounded manifest page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveAnalysisDocumentPage' }
        default: { $ref: '#/components/responses/AnalysisProblem' }
  /api/chat/requests/{requestId}/analysis/scope:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      operationId: reviseDriveAnalysisScope
      tags: [DriveAnalyses]
      summary: Explicitly replace a paused analysis scope and invalidate its plan
      description: >-
        Allowed only with no physically active child. Captures a new
        scope version and preserves prior execution and financial evidence. Never
        silently substitutes READY files for the original scope. The replacement
        is visible before a new plan can be approved; no generation starts here.
        clientActionId is user/parent/action bound and replay returns the accepted
        result without repeating the mutation. Different payload reuse is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseDriveAnalysisScope' }
      responses:
        '200':
          description: Accepted replacement scope, without starting paid work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveAnalysisStatus' }
        default: { $ref: '#/components/responses/AnalysisProblem' }
  /api/chat/requests/{requestId}/analysis/plan:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      operationId: prepareDriveAnalysisPlan
      tags: [DriveAnalyses]
      summary: Request a finite, versioned quote for the remaining analysis
      description: >-
        Idempotently schedules bounded source verification and planning, including
        token counting when authorized. Never generates an answer, reserves money
        or replays an uncertain child. expectedPlanVersion is zero before the first
        plan. New price, profile, period or scope requires a new plan version.
        No live child may be superseded. Uncertain results cannot be reused;
        reprocessing uses new disclosed nodes after physical-execution safety gates
        admit it. The parent remains the
        same chat turn; polling only reads the durable planning result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareDriveAnalysisPlan' }
      responses:
        '202':
          description: Planning accepted or an identical action replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveAnalysisStatus' }
        default: { $ref: '#/components/responses/AnalysisProblem' }
  /api/chat/requests/{requestId}/analysis/start:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      operationId: startDriveAnalysis
      tags: [DriveAnalyses]
      summary: Approve exactly one current plan and start the parent workflow
      description: >-
        Requires the unexpired planVersion/hash, current scope and consent, an
        available user slot and atomic reservation of the full remaining upper
        cost. The existing monthly policy and owner exception apply. Insufficient
        budget yields WAITING_BUDGET before the first generation. A concurrent
        action cannot reserve or dispatch twice. No provider call occurs under
        financial locks. Ordinary chat continues to use its existing start route.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveDriveAnalysisPlan' }
      responses:
        '202':
          description: Current parent status after accepting the exact plan
          content:
            application/json:
              schema: { $ref: './chat-v1.yaml#/components/schemas/RequestStatus' }
        default: { $ref: '#/components/responses/AnalysisProblem' }
  /api/chat/requests/{requestId}/analysis/continue:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      operationId: continueDriveAnalysis
      tags: [DriveAnalyses]
      summary: Explicitly approve the current remaining plan of a paused workflow
      description: >-
        Same ownership, consent, idempotency, slot and full-envelope checks as
        start. Only confirmed complete, still-valid results may be reused.
        Uncertain child execution is never replayed. Reprocessing is represented
        by new disclosed nodes and new child requests in the approved plan.
        Expired price/profile or a month boundary requires a newly quoted remaining
        plan first. Refreshing, reconnecting, polling and stream opening never
        authorize continuation. A discarded parent cannot be continued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveDriveAnalysisPlan' }
      responses:
        '202':
          description: Current parent status after explicit continuation
          content:
            application/json:
              schema: { $ref: './chat-v1.yaml#/components/schemas/RequestStatus' }
        default: { $ref: '#/components/responses/AnalysisProblem' }
components:
  securitySchemes:
    browserSession: { type: apiKey, in: cookie, name: BANDEE_SESSION }
  parameters:
    RequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string }
  responses:
    AnalysisProblem:
      description: >-
        Sanitized application problem. 400 invalid input, 401 unauthenticated,
        403 consent/access denied, 404 inaccessible parent, 409 stale plan,
        idempotency conflict or incompatible state, 429 capacity, 503 unavailable
        capability. Never includes document text, intermediate output or raw errors.
      content:
        application/json:
          schema: { $ref: './chat-v1.yaml#/components/schemas/Problem' }
  schemas:
    DriveAnalysisScopeInput:
      type: object
      additionalProperties: false
      required: [mode, expectedConnectionVersion]
      description: >-
        Explicit scope accepted with a new chat turn or an explicit paused-scope
        revision. ALL_DOCUMENTS captures all supported files from the latest
        completed metadata cycle, including files not yet indexed. SELECTED_DOCUMENTS
        requires nonempty documentIds from that same owned connection/generation.
        documentIds is forbidden for ALL_DOCUMENTS. No fixed file-count product
        ceiling; request transport admission is a separate technical limit.
        Absent driveScope preserves ordinary relevant-source chat behavior.
      properties:
        mode: { type: string, enum: [ALL_DOCUMENTS, SELECTED_DOCUMENTS] }
        expectedConnectionVersion: { type: integer, format: int64, minimum: 0 }
        documentIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    DriveAnalysisScope:
      type: object
      additionalProperties: false
      required: [version, mode, connectionVersion, indexGeneration, observedAt, metadataCycleId, documents]
      description: >-
        Immutable observed version manifest, not an atomic Google Drive snapshot.
        New files never silently enter it. Source/access changes invalidate affected
        work and descendants. Document versions and full indexed ranges are fixed
        before the plan is quoted; pending files remain in the denominator.
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [ALL_DOCUMENTS, SELECTED_DOCUMENTS] }
        connectionVersion: { type: integer, format: int64, minimum: 0 }
        indexGeneration: { type: integer, format: int64, minimum: 0 }
        observedAt: { type: string, format: date-time }
        metadataCycleId: { type: string, format: uuid }
        documents: { type: integer, format: int64, minimum: 0 }
    DriveAnalysisPhase:
      type: string
      enum: [WAITING_INDEX, PLANNING, QUOTED, QUEUED, VERIFYING, RUNNING, MERGING, WAITING_RESOURCE, WAITING_BUDGET, INTERRUPTED, INVALIDATED, COMPLETED, FAILED, DISCARDED]
    DriveAnalysisCoverage:
      type: object
      additionalProperties: false
      required: [documents, readyDocuments, pendingDocuments, skippedDocuments, failedDocuments, submittedDocuments, processedDocuments, citedDocuments, ranges, submittedRanges, processedRanges, textlessPages, result]
      description: >-
        int64 counts over the captured scope, never a page count. ready/pending/
        skipped/failed partition the manifest's index eligibility; submitted,
        processed and cited are distinct measures and may overlap those states.
        A document is processed only when every required indexed range has a
        validated complete result. Textless pages prevent a claim that all original
        document content was read. COMPLETE requires full scope/range coverage and
        validated final output; it does not assert infallible model interpretation.
      properties:
        documents: { type: integer, format: int64, minimum: 0 }
        readyDocuments: { type: integer, format: int64, minimum: 0 }
        pendingDocuments: { type: integer, format: int64, minimum: 0 }
        skippedDocuments: { type: integer, format: int64, minimum: 0 }
        failedDocuments: { type: integer, format: int64, minimum: 0 }
        submittedDocuments: { type: integer, format: int64, minimum: 0 }
        processedDocuments: { type: integer, format: int64, minimum: 0 }
        citedDocuments: { type: integer, format: int64, minimum: 0 }
        ranges: { type: integer, format: int64, minimum: 0 }
        submittedRanges: { type: integer, format: int64, minimum: 0 }
        processedRanges: { type: integer, format: int64, minimum: 0 }
        textlessPages: { type: integer, format: int64, minimum: 0 }
        result: { type: string, enum: [NONE, PARTIAL, COMPLETE] }
    DriveAnalysisPlan:
      type: object
      additionalProperties: false
      required: [version, hash, scopeVersion, profileHash, model, modelRevision, priceVersionId, quotedAt, expiresAt, periodStart, periodEnd, steps, leafSteps, mergeSteps, reusedSteps, upperCostUsd, maxInputTokens, maxOutputTokens, billableOutputTokenUpperBound]
      description: >-
        Finite deterministic remaining call graph, without a fixed total-step cap.
        A small complete scope can use a single final call. Larger scopes cover all
        ranges with leaves and a finite reduction tree. Unknown intermediate inputs
        use verified conservative upper bounds; each physical call is counted again
        before dispatch. hash binds owner/parent, scope/plan versions, graph,
        profile, per-step output limits, prices, period and the full upper cost.
        upperCostUsd includes existing reservation factors and buffers and excludes
        previously charged work. It is not a new monthly allowance or a reservation.
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        scopeVersion: { type: integer, format: int64, minimum: 1 }
        profileHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        model: { type: string }
        modelRevision: { type: string }
        priceVersionId: { type: string, format: uuid }
        quotedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        steps: { type: integer, format: int64, minimum: 1 }
        leafSteps: { type: integer, format: int64, minimum: 0 }
        mergeSteps: { type: integer, format: int64, minimum: 0 }
        reusedSteps: { type: integer, format: int64, minimum: 0 }
        upperCostUsd: { type: string, pattern: '^[0-9]+\.[0-9]{9}$' }
        maxInputTokens: { type: integer, format: int64, minimum: 1 }
        maxOutputTokens: { type: integer, format: int64, minimum: 1 }
        billableOutputTokenUpperBound: { type: integer, format: int64, minimum: 1 }
    DriveAnalysisStatus:
      type: object
      additionalProperties: false
      required: [requestId, phase, coverage, completedSteps, continuationAllowed, observedAt]
      properties:
        requestId: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/DriveAnalysisPhase' }
        scope: { $ref: '#/components/schemas/DriveAnalysisScope' }
        plan: { $ref: '#/components/schemas/DriveAnalysisPlan' }
        coverage: { $ref: '#/components/schemas/DriveAnalysisCoverage' }
        completedSteps: { type: integer, format: int64, minimum: 0 }
        continuationAllowed: { type: boolean }
        observedAt: { type: string, format: date-time }
        lastProgressAt: { type: string, format: date-time }
        nextRetryAt: { type: string, format: date-time }
        waitingReason:
          type: string
          enum: [INDEX_PENDING, SOURCE_VERIFICATION, TEMP_STORAGE, DATABASE_STORAGE, MEMORY, PARSER, PROVIDER_QUOTA, MODEL_CAPACITY, USER_SLOT, PERSONAL_BUDGET, SHARED_BUDGET, PROFILE_EXPIRED, PRICE_EXPIRED, PERIOD_CHANGED, EXECUTION_UNCERTAIN]
        problem: { $ref: './chat-v1.yaml#/components/schemas/Problem' }
      description: >-
        Content-free workflow state beside the parent's independent execution and
        accounting states. scope may be absent while waiting for the first complete
        metadata cycle. plan is absent until a complete finite quote exists.
        Waiting/planning/quoted and durably paused parents hold no active user slot.
        continuationAllowed never authorizes automatic work and is false until a
        safe remaining plan is ready. Parent reservedUsd is free envelope plus open
        child reservations, counted once; actualUsd aggregates finalized child
        charges without another parent usage charge or an invented shared price.
    DriveAnalysisDocument:
      type: object
      additionalProperties: false
      required: [documentId, fileName, sourceVersion, state, ranges, submittedRanges, processedRanges, textlessPages]
      properties:
        documentId: { type: string, format: uuid }
        fileName: { type: string, maxLength: 500 }
        sourceVersion: { type: string }
        indexVersionId: { type: string, format: uuid }
        processingProfile: { type: string }
        state: { type: string, enum: [WAITING_INDEX, READY, SKIPPED, FAILED, INVALIDATED, PROCESSING, PROCESSED] }
        ranges: { type: integer, format: int64, minimum: 0 }
        submittedRanges: { type: integer, format: int64, minimum: 0 }
        processedRanges: { type: integer, format: int64, minimum: 0 }
        textlessPages: { type: integer, format: int64, minimum: 0 }
        reason:
          type: string
          enum: [INDEX_PENDING, INCOMPLETE_INDEX, OCR_REQUIRED, ACCESS_LOST, SOURCE_CHANGED, PROCESSING_UNAVAILABLE, STORAGE_PRESSURE, INVALID_RESULT, OUTPUT_TRUNCATED]
      description: >-
        Captured source metadata and coverage only. No document or intermediate
        text. Pending ranges are not yet known, so zero does not mean processed.
        INVALIDATED never erases the original manifest membership.
    DriveAnalysisDocumentPage:
      type: object
      additionalProperties: false
      required: [scopeVersion, items, total]
      properties:
        scopeVersion: { type: integer, format: int64, minimum: 1 }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DriveAnalysisDocument' }
        total: { type: integer, format: int64, minimum: 0 }
        nextCursor: { type: string, maxLength: 4096 }
    ReviseDriveAnalysisScope:
      type: object
      additionalProperties: false
      required: [clientActionId, expectedScopeVersion, scope]
      properties:
        clientActionId: { type: string, format: uuid }
        expectedScopeVersion: { type: integer, format: int64, minimum: 1 }
        scope: { $ref: '#/components/schemas/DriveAnalysisScopeInput' }
    PrepareDriveAnalysisPlan:
      type: object
      additionalProperties: false
      required: [clientActionId, scopeVersion, expectedPlanVersion]
      properties:
        clientActionId: { type: string, format: uuid }
        scopeVersion: { type: integer, format: int64, minimum: 1 }
        expectedPlanVersion: { type: integer, format: int64, minimum: 0 }
    ApproveDriveAnalysisPlan:
      type: object
      additionalProperties: false
      required: [clientActionId, planVersion, planHash]
      properties:
        clientActionId: { type: string, format: uuid }
        planVersion: { type: integer, format: int64, minimum: 1 }
        planHash: { type: string, pattern: '^[a-f0-9]{64}$' }
