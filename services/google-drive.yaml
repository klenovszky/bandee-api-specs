openapi: 3.0.3
info:
  title: Bandee Google Drive integration
  version: 1.1.0
security:
  - browserSession: []
paths:
  /api/drive:
    get:
      tags: [GoogleDrive]
      operationId: getDriveConnection
      summary: Read the current account's Drive pilot settings, never cached
      responses:
        '400':
          $ref: '#/components/responses/DriveProblem'
        '401':
          $ref: '#/components/responses/DriveProblem'
        '403':
          $ref: '#/components/responses/DriveProblem'
        '404':
          $ref: '#/components/responses/DriveProblem'
        '409':
          $ref: '#/components/responses/DriveProblem'
        '429':
          $ref: '#/components/responses/DriveProblem'
        '503':
          $ref: '#/components/responses/DriveProblem'
        '200':
          description: Only the configured, active registered pilot account is eligible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveConnection' }
    put:
      tags: [GoogleDrive]
      operationId: connectDriveFolder
      summary: Confirm a folder with separate local import and cloud permissions
      description: >-
        The server revalidates the folder, preview token, account and expected version.
        Replacement invalidates in-flight work and excludes old derived history from
        future model contexts. Local text/vector storage requires importConsent;
        existing connections are not silently opted in. Credentials remain in the
        trusted backend/worker services. Confirmation schedules asynchronous work.
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveFolderConfirmation' }
      responses:
        '400':
          $ref: '#/components/responses/DriveProblem'
        '401':
          $ref: '#/components/responses/DriveProblem'
        '403':
          $ref: '#/components/responses/DriveProblem'
        '404':
          $ref: '#/components/responses/DriveProblem'
        '409':
          $ref: '#/components/responses/DriveProblem'
        '429':
          $ref: '#/components/responses/DriveProblem'
        '503':
          $ref: '#/components/responses/DriveProblem'
        '200':
          description: Folder confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveConnection' }
    patch:
      tags: [GoogleDrive]
      operationId: setDriveCloudConsent
      summary: Change the separate Gemini permission, fencing pending requests
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveCloudConsent' }
      responses:
        '400':
          $ref: '#/components/responses/DriveProblem'
        '401':
          $ref: '#/components/responses/DriveProblem'
        '403':
          $ref: '#/components/responses/DriveProblem'
        '404':
          $ref: '#/components/responses/DriveProblem'
        '409':
          $ref: '#/components/responses/DriveProblem'
        '429':
          $ref: '#/components/responses/DriveProblem'
        '503':
          $ref: '#/components/responses/DriveProblem'
        '200':
          description: Permission updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveConnection' }
  /api/drive/import:
    patch:
      tags: [GoogleDrive]
      operationId: setDriveImportConsent
      summary: Grant or revoke persistent local text and vector indexing
      description: >-
        Granting consent schedules background processing independently of Gemini
        consent. Revocation immediately fences retrieval and running work, and
        queues removal of locally indexed text and vectors. Original Drive files
        are never changed. expectedVersion provides account-bound concurrency control.
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveImportConsent' }
      responses:
        '200':
          description: Permission updated; processing or cleanup continues asynchronously
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveConnection' }
        '400': { $ref: '#/components/responses/DriveProblem' }
        '401': { $ref: '#/components/responses/DriveProblem' }
        '403': { $ref: '#/components/responses/DriveProblem' }
        '409': { $ref: '#/components/responses/DriveProblem' }
        '429': { $ref: '#/components/responses/DriveProblem' }
        '503': { $ref: '#/components/responses/DriveProblem' }
  /api/drive/preview:
    post:
      tags: [GoogleDrive]
      operationId: previewDriveFolder
      summary: Validate a recognized Drive folder URL without fetching that URL
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveFolderInput' }
      responses:
        '400':
          $ref: '#/components/responses/DriveProblem'
        '401':
          $ref: '#/components/responses/DriveProblem'
        '403':
          $ref: '#/components/responses/DriveProblem'
        '404':
          $ref: '#/components/responses/DriveProblem'
        '409':
          $ref: '#/components/responses/DriveProblem'
        '429':
          $ref: '#/components/responses/DriveProblem'
        '503':
          $ref: '#/components/responses/DriveProblem'
        '200':
          description: Account-bound preview valid for five minutes; not connected yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveFolderPreview' }
  /api/drive/disconnect:
    post:
      tags: [GoogleDrive]
      operationId: disconnectDriveFolder
      summary: Invalidate the folder immediately and optionally queue complete conversation erasure
      description: >-
        Works while the feature switch is off. Preserved conversations remain readable
        but their derived content and titles cannot be sent to Gemini again. The affected
        count includes every conversation marked before source-bearing countTokens calls,
        including failed or incomplete replies. Repeated requests with the same disconnected
        version are safe. Google sharing must be revoked separately in Drive.
        Local indexed text and vectors are always removed; deleteConversations
        controls the separate conversation history choice only.
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveDisconnect' }
      responses:
        '400':
          $ref: '#/components/responses/DriveProblem'
        '401':
          $ref: '#/components/responses/DriveProblem'
        '403':
          $ref: '#/components/responses/DriveProblem'
        '404':
          $ref: '#/components/responses/DriveProblem'
        '409':
          $ref: '#/components/responses/DriveProblem'
        '429':
          $ref: '#/components/responses/DriveProblem'
        '503':
          $ref: '#/components/responses/DriveProblem'
        '200':
          description: Disconnected; durable deletion continues until safe completion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveConnection' }
components:
  responses:
    DriveProblem:
      description: Sanitized failure with a stable code, processing stage and request ID; never retried automatically
      content:
        application/json:
          schema: { $ref: './chat-v1.yaml#/components/schemas/Problem' }
  securitySchemes:
    browserSession: { type: apiKey, in: cookie, name: BANDEE_SESSION }
  parameters:
    Csrf: { in: header, name: X-CSRF-TOKEN, required: true, schema: { type: string } }
  schemas:
    DriveConnection:
      type: object
      additionalProperties: false
      required: [eligible, enabled, connected, available, version, cloudConsent, affectedConversations, deletionPending]
      properties:
        eligible: { type: boolean }
        enabled: { type: boolean }
        connected: { type: boolean }
        available: { type: boolean }
        serviceAccountEmail: { type: string, maxLength: 254 }
        folderId: { type: string }
        folderName: { type: string, maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
        cloudConsent: { type: boolean }
        importConsent: { type: boolean, default: false }
        index: { $ref: '#/components/schemas/DriveIndexStatus' }
        affectedConversations: { type: integer, minimum: 0 }
        deletionPending: { type: boolean }
        problem: { $ref: './chat-v1.yaml#/components/schemas/Problem' }
    DriveFolderInput:
      type: object
      additionalProperties: false
      required: [folderUrl]
      properties:
        folderUrl: { type: string, minLength: 1, maxLength: 2048 }
    DriveFolderPreview:
      type: object
      additionalProperties: false
      required: [folderId, folderName, previewToken, expectedVersion]
      properties:
        folderId: { type: string }
        folderName: { type: string, maxLength: 500 }
        previewToken: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64 }
    DriveFolderConfirmation:
      type: object
      additionalProperties: false
      required: [previewToken, expectedVersion, cloudConsent]
      properties:
        previewToken: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        cloudConsent: { type: boolean }
        importConsent:
          type: boolean
          default: false
          description: Explicit permission for persistent local extracted text and vectors; omission means false
    DriveImportConsent:
      type: object
      additionalProperties: false
      required: [expectedVersion, importConsent]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        importConsent: { type: boolean }
    DriveIndexStatus:
      type: object
      additionalProperties: false
      required: [state, readyFiles, pendingFiles, skippedFiles, failedFiles]
      description: Account-scoped background processing metadata; contains no document text or credentials
      properties:
        state:
          type: string
          enum: [DISABLED, PENDING, SYNCING, READY, PARTIAL, STALE, ERROR]
        readyFiles: { type: integer, minimum: 0 }
        pendingFiles: { type: integer, minimum: 0 }
        skippedFiles: { type: integer, minimum: 0 }
        failedFiles: { type: integer, minimum: 0 }
        lastCheckedAt: { type: string, format: date-time }
        lastIndexedAt: { type: string, format: date-time }
        problem: { $ref: './chat-v1.yaml#/components/schemas/Problem' }
    DriveCloudConsent:
      type: object
      additionalProperties: false
      required: [expectedVersion, cloudConsent]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        cloudConsent: { type: boolean }
    DriveDisconnect:
      type: object
      additionalProperties: false
      required: [expectedVersion, deleteConversations]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        deleteConversations: { type: boolean }
    DriveSearchState:
      type: string
      enum: [NOT_USED, SEARCHING, FOUND, NO_MATCH, PARTIAL, ACCESS_LOST, UNAVAILABLE, OCR_REQUIRED, INDEX_PENDING, INDEX_STALE]
    DriveSource:
      type: object
      additionalProperties: false
      required: [id, fileName, fileVersion]
      description: Server-issued and verified provenance only; no extracted text or credentials
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, maxLength: 500 }
        fileVersion: { type: string, maxLength: 100 }
        page: { type: integer, minimum: 1 }
