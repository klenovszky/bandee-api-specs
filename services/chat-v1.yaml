openapi: 3.0.3
info:
  title: Bandee Chat V1 - Browser API
  version: 0.2.0
  description: 'All operations require the existing same-origin session. State-changing
    operations require CSRF. GET never starts a provider call. Private responses use
    Cache-Control: no-store. Registered and active guest principals use the same
    ownership checks. Guest expiry is checked before protected operations and
    dispatch, and while streaming. Session/CSRF/status polling and stream heartbeats
    never renew guest activity; accepted user actions may renew it within its
    absolute lifetime. Guest policy limits may be stricter than schema maxima.'
security:
- browserSession: [
    ]
tags:
- name: ChatConversations
- name: ChatRequests
- name: ChatStreams
- name: AiBudget
paths:
  /api/chat/conversations:
    get:
      operationId: listConversations
      tags:
      - ChatConversations
      summary: List only owned conversations, newest activity first
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: Opaque cursor binds user, sort and last updatedAt/id pair. A concurrently
        active conversation can move between pages; client deduplicates by id. Foreign
        or malformed cursors fail without revealing ownership.
      security:
      - browserSession: [
          ]
    post:
      operationId: createConversation
      tags:
      - ChatConversations
      summary: Create an empty owned conversation
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
