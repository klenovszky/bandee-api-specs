          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: discard
        in: query
        required: false
        schema:
          type: boolean
          default: false
