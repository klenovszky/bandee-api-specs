        description: Obtain the session-bound token from the existing auth CSRF operation.
      description: Returns 202 quickly after accepting the orchestration task; inspect
        SSE/status for preparation, reservation or provider errors. Repeated start
        never redispatches. Before dispatch, lack of a live stream terminates without
        a provider call. Restart never automatically replays a durable dispatch claim.
      security:
      - browserSession: [
          ]
  /api/chat/requests/{requestId}/cancel:
    post:
      operationId: cancelChatRequest
      tags:
      - ChatRequests
      summary: Idempotently cancel, optionally discarding the turn and settling the full reservation
      description: >-
        With discard=true, remove the request turn content, permanently charge the full
        existing reservation, and immediately release the user slot. Provider termination
        is tracked separately in the background; discarded output must never reappear.
        Without discard, retain the existing best-effort cancellation semantics.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '400':
          description: Sanitized application problem
