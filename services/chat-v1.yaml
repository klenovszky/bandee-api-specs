              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: Opaque cursor binds user, sort and last updatedAt/id pair. A concurrently
        active conversation can move between pages; client deduplicates by id. Foreign
        or malformed cursors fail without revealing ownership.
      security:
      - browserSession: [
          ]
    post:
      operationId: createConversation
      tags:
      - ChatConversations
      summary: Create an empty owned conversation
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
