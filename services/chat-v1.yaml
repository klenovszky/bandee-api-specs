          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: Initial page contains the latest messages, returned oldest-to-newest.
        nextCursor loads earlier pages. Cursor is opaque and bound to authenticated
        user and conversation. Attempts are separate assistant messages linked by
        requestId; failed/partial attempts stay visible.
      security:
      - browserSession: [
          ]
  /api/chat/conversations/{conversationId}/input-analyses:
    post:
      operationId: createInputAnalysis
      tags:
      - ChatRequests
      summary: Accept one paid voice review or first-question title task without starting generation
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
