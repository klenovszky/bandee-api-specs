        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: Previously accepted identical request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInputAnalysis'
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Obtain the session-bound token from the existing auth CSRF operation.
      description: >-
        Acquires the same per-user execution slot and enforces the same global,
        personal and guest limits as chat. Idempotency keys share the chat request
        namespace; changed purpose, content, conversation or language is a conflict.
        VOICE_REVIEW requires nonblank content; FIRST_TITLE forbids content and reads
        the first saved user message server-side. FIRST_TITLE is accepted only when
        that message has no applied AI title and no successful or unresolved title task.
        A deliberate retry must be explicit and use a new idempotency key after a
        confirmed failed attempt; no automatic paid replay is allowed. Acceptance
        itself never invokes the provider. Use the existing request stream and start
        operations to execute; auxiliary streams emit lifecycle events but no raw
        model-output deltas. The validated result is available separately only after
        confirmed completion. No chat messages are created by an analysis task.
      security:
      - browserSession: [
          ]
  /api/chat/conversations/{conversationId}/input-analyses/discard:
    post:
      operationId: discardInputAnalysis
      tags:
      - ChatRequests
      summary: Resolve an uncertain analysis submission and stop its original task
      description: >-
        Atomically resolves the original clientRequestId and detaches only that
        auxiliary task. Never starts a provider call or creates/deletes a chat turn.
        Existing reservation, if any, is charged conservatively in full through the
        existing interruption rules. Unknown execution is not proof of zero cost.
        Repeating the same original payload is idempotent; mismatched payload is 409.
        The discard query parameter defaults to true: true erases auxiliary private
        input/output; false retains it for inspection without making an incomplete
        result eligible for automatic submission. No automatic paid retry occurs.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Sanitized application problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: Previously accepted identical request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInputAnalysis'
      parameters:
      - name: discard
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: False resolves a technical interruption while preserving auxiliary input and partial output.
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Obtain the session-bound token from the existing auth CSRF operation.
      security:
      - browserSession: [
          ]
  /api/chat/input-analyses/{requestId}:
    get:
      operationId: getInputAnalysis
      tags: [ChatRequests]
      summary: Read the validated result of an owned, completed auxiliary task
      description: >-
        Private content; Cache-Control no-store. GET never generates or charges.
        Return 409 unless execution is confirmed COMPLETED and a validated result
        exists. Return 404 for foreign, deleted or discarded results. An interrupted
        result is never treated as approved input. An expired guest cannot read it.
      security:
      - browserSession: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Validated analysis; never raw provider output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputAnalysisResult'
        '400':
          description: Sanitized application problem
          content:
