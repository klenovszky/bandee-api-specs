components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: BANDEE_SESSION
  schemas:
    ResponseLanguage:
      type: string
      enum: [hu, en]
      description: Default language of a newly generated answer; explicit translation targets and quoted content are preserved.
    ExecutionState:
      type: string
      enum:
      - AWAITING_STREAM
      - PREPARING
      - DISPATCHING
      - STREAMING
      - CANCEL_REQUESTED
      - COMPLETED
      - FAILED
      - CANCELLED
      - INTERRUPTED
      - UNKNOWN
    AccountingState:
      type: string
      enum:
      - NONE
      - RESERVED
      - SETTLED
      - RELEASED
      - UNCERTAIN
    Problem:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - GUEST_EXPIRED
          - GUEST_DISABLED
          - SESSION_CONFLICT
          - LINK_UNAVAILABLE
          - FORBIDDEN
          - NOT_FOUND
          - INVALID_INPUT
          - IDEMPOTENCY_CONFLICT
          - USER_BUSY
          - STREAM_BUSY
          - STREAM_REQUIRED
          - RETRY_NOT_ALLOWED
          - RESOURCE_LIMIT
          - BUDGET_UNAVAILABLE
          - AI_UNAVAILABLE
          - CONTEXT_TOO_LARGE
          - PROVIDER_FAILURE
          - OUTCOME_UNCERTAIN
          - REQUEST_EXPIRED
          - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
          format: uuid
        retryAllowed:
          type: boolean
      required:
      - code
      - message
      - retryAllowed
    Conversation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - createdAt
      - updatedAt
    Message:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        role:
          type: string
          enum:
          - USER
          - ASSISTANT
        content:
          type: string
        contentState:
          type: string
          enum:
          - COMPLETE
          - PARTIAL
          - EMPTY
        createdAt:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
      required:
      - id
      - sequence
      - role
      - content
      - contentState
      - createdAt
    RequestStatus:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [CHAT, VOICE_REVIEW, FIRST_TITLE]
          default: CHAT
          description: Immutable execution purpose. Auxiliary work has no chat message IDs and is never retryable via retryOf.
        interrupted:
          type: boolean
          default: false
          description: Interruption is finalized and execution is detached; content is retained unless discarded=true. New requests may proceed without automatic paid replay.
        discarded:
          type: boolean
          default: false
          description: >-
            Content was discarded by explicit user Stop. Do not display request status,
            partial output or recovery actions. Accounting is final and new requests are
            allowed independently of background provider termination.
        responseLanguage:
          $ref: '#/components/schemas/ResponseLanguage'
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        userMessageId:
          type: string
          format: uuid
        assistantMessageId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        executionState:
          $ref: '#/components/schemas/ExecutionState'
        accountingState:
          $ref: '#/components/schemas/AccountingState'
        retryOf:
          type: string
          format: uuid
        retryAllowed:
          type: boolean
        executionConfirmedEnded:
          type: boolean
        includedTurns:
          type: integer
          format: int64
          minimum: 0
        omittedTurns:
          type: integer
          format: int64
          minimum: 0
        reservedUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        actualUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Final charged USD, including a full-reservation charge for user Stop; not necessarily measured provider cost.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        problem:
          $ref: '#/components/schemas/Problem'
      required:
      - responseLanguage
      - id
      - clientRequestId
      - executionState
      - accountingState
      - retryAllowed
      - executionConfirmedEnded
      - createdAt
      description: Content-free status. Auxiliary requests have no chat message IDs,
        emit no raw provider-output deltas and do not allow retryOf. Their validated
        result is read separately. Conversation and message IDs may be absent
        after actual content deletion. Reading a request never triggers generation.
        Unknown execution and uncertain accounting are separate concepts.
        responseLanguage is the immutable language accepted for this request, including after restart or content deletion.
    OwnBudget:
      type: object
      additionalProperties: false
      properties:
        budgetScope:
          type: string
          enum: [MONTHLY, GUEST_LIFETIME]
          default: MONTHLY
          description: Guest lifetime amounts never reset on a calendar month boundary.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        currency:
          type: string
          enum:
          - USD
        owner:
          type: boolean
        personalLimitUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        spentUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        reservedUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        unresolvedPriorUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        availableUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        canGenerate:
          type: boolean
        blockReason:
          type: string
          enum:
          - NONE
          - ZERO_PERSONAL_BUDGET
          - PERSONAL_LIMIT
          - GLOBAL_LIMIT
          - AI_DISABLED
          - UNRESOLVED_EXECUTION
          - CONFIGURATION_REQUIRED
          - GUEST_DISABLED
          - GUEST_POOL_LIMIT
        globalLimitUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        globalSpentUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        globalReservedUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
        globalBufferUsd:
          type: string
          pattern: ^[0-9]+\.[0-9]{9}$
          example: '20.000000000'
          description: Non-negative USD decimal; never binary floating point.
      required:
      - periodStart
      - periodEnd
      - currency
      - owner
      - spentUsd
      - reservedUsd
      - unresolvedPriorUsd
      - availableUsd
      - canGenerate
      - blockReason
      description: >-
        Only own usage. For the registered owner, availableUsd is global availability
        and global* fields are present. For other registered users global* fields are
        absent, availableUsd is personal availability and canGenerate also checks the
        undisclosed global cap. For GUEST_LIFETIME, owner is always false, periodStart
        is guest creation, periodEnd is the absolute lifetime deadline, personalLimitUsd
        is the lifetime allowance and spentUsd/reservedUsd cover the entire guest
        lifetime. unresolvedPriorUsd is zero because all guest reservations are already
        counted in reservedUsd across months. availableUsd is remaining lifetime
        allowance; canGenerate additionally checks undisclosed global and monthly
        guest-pool capacity and guest policy. Neither shared pool amounts nor other
        users' usage is exposed. All amounts use nine-decimal USD strings. A balance
        snapshot is not a reservation or a guarantee that another call fits.
    CreateRequest:
      description: For a new turn content is required and nonblank, retryOf is absent.
        For a retry retryOf is required and content must be absent; it references
        the latest failed/cancelled turn in this conversation. Validate these mutually
        exclusive cases server-side. UUID reuse with different normalized content/conversation/retry
        target or normalized responseLanguage is 409. Missing responseLanguage normalizes
        to hu for compatibility. A repeated clientRequestId must retain its original
        language even if the GUI language changed. A retry with a new clientRequestId
        uses the newly selected responseLanguage; it does not inherit the old answer's
        language. Changing the GUI alone never starts or cancels generation.
        inputAnalysisId is allowed only for a new turn, participates in idempotency,
        and cannot reference another user, conversation, language or an incomplete task.
      oneOf:
      - $ref: '#/components/schemas/CreateNewTurn'
      - $ref: '#/components/schemas/RetryTurn'
    PublicStreamEvent:
      description: SSE event name equals type. JSON data uses this envelope; sequence
        increases within one connection and is not a replay cursor. ready has no delta/status;
        delta requires delta; status and terminal require status. terminal status
        must be terminal. No raw provider errors. Heartbeats are SSE comments, not
        JSON events.
      oneOf:
      - $ref: '#/components/schemas/PublicReadyEvent'
      - $ref: '#/components/schemas/PublicStatusEvent'
      - $ref: '#/components/schemas/PublicDeltaEvent'
      - $ref: '#/components/schemas/PublicTerminalEvent'
      discriminator:
        propertyName: type
        mapping:
          ready: '#/components/schemas/PublicReadyEvent'
          status: '#/components/schemas/PublicStatusEvent'
          delta: '#/components/schemas/PublicDeltaEvent'
          terminal: '#/components/schemas/PublicTerminalEvent'
    ConversationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: string
      required:
      - items
    MessagePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
      required:
      - items
    PublicReadyEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - ready
        requestId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
      required:
      - type
      - requestId
      - sequence
    PublicStatusEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - status
        requestId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/RequestStatus'
      required:
      - type
      - requestId
      - sequence
      - status
    PublicDeltaEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - delta
        requestId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        delta:
          type: string
      required:
      - type
      - requestId
      - sequence
      - delta
    PublicTerminalEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - terminal
        requestId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/RequestStatus'
      required:
      - type
      - requestId
      - sequence
      - status
    CreateNewTurn:
      type: object
      additionalProperties: false
      required:
      - clientRequestId
      - content
      properties:
        inputAnalysisId:
          type: string
          format: uuid
          description: >-
            Optional completed VOICE_REVIEW request owned by this user in this
            conversation and language. The supplied content must equal its reviewed
            text exactly. It can attach a validated short title to the first turn;
            reuse cannot create a second turn. Include it in the idempotency hash.
            A REVIEW decision may be sent only through an explicit user Send action;
            automatic voice submission requires ACCEPT. Omit this field after manual
            edits; edited text is ordinary user input and receives no analysis title.
        responseLanguage:
          allOf:
          - $ref: '#/components/schemas/ResponseLanguage'
          default: hu
          description: Omission normalizes to hu. The accepted value is persisted before preparation. Explicit null or unsupported values are invalid.
        clientRequestId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 16000
    RetryTurn:
      type: object
      additionalProperties: false
      required:
      - clientRequestId
      - retryOf
      properties:
        responseLanguage:
          allOf:
          - $ref: '#/components/schemas/ResponseLanguage'
          default: hu
          description: Omission normalizes to hu. The accepted value is persisted before preparation. Explicit null or unsupported values are invalid.
        clientRequestId:
          type: string
          format: uuid
        retryOf:
          type: string
          format: uuid
    CreateInputAnalysis:
      type: object
      additionalProperties: false
      required: [clientRequestId, mode, responseLanguage]
      properties:
        clientRequestId: {type: string, format: uuid}
        responseLanguage:
          $ref: '#/components/schemas/ResponseLanguage'
        mode:
          type: string
          enum: [VOICE_REVIEW, FIRST_TITLE]
        content:
          type: string
          minLength: 1
          maxLength: 16000
          description: Required only for VOICE_REVIEW; forbidden for FIRST_TITLE. Guest input limits also apply.
    InputAnalysisResult:
      type: object
      additionalProperties: false
      required: [requestId, mode, responseLanguage, originalText, reviewedText, decision, reviewReason, uncertainTerms]
      properties:
        requestId: {type: string, format: uuid}
        mode:
          type: string
          enum: [VOICE_REVIEW, FIRST_TITLE]
        responseLanguage:
          $ref: '#/components/schemas/ResponseLanguage'
        originalText:
          type: string
          minLength: 1
          maxLength: 16000
        reviewedText:
          type: string
          minLength: 1
          maxLength: 16000
          description: >-
            Conservative correction, never an answer. Preserve meaning, unknown terms,
            names, numbers, negation and code. FIRST_TITLE returns originalText unchanged.
        decision:
          type: string
          enum: [ACCEPT, REVIEW]
          description: >-
            A model-assisted estimate, not proof of recognition accuracy. Short
            contextually meaningful replies are valid. Ambiguity, uncertain terms or
            possible meaning changes require REVIEW and stop automatic submission.
        reviewReason:
          type: string
          enum: [NONE, AMBIGUOUS, UNCERTAIN_TERMS, POSSIBLE_MEANING_CHANGE]
          description: Localized by the frontend; no model-generated diagnostic prose. ACCEPT requires NONE and empty uncertainTerms; REVIEW requires a non-NONE reason. FIRST_TITLE uses ACCEPT and NONE.
        uncertainTerms:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 200}
          description: >-
            Literal substrings of reviewedText, validated server-side. Mark as
            uncertain, not as confirmed errors. Never replace an unknown term solely
            because it is absent from a dictionary. Empty for FIRST_TITLE.
        shortTitle:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Optional localized one- or two-word title, at most 32 Unicode code points.
            For voice, generated in the same call only when the conversation has no
            saved user turn. For FIRST_TITLE, applied atomically only if its original
            first-message anchor still matches and no newer title has been applied.
            The frontend must also handle pixel overflow on narrow screens.
