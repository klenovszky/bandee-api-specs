  /api/chat/conversations/{conversationId}/requests/discard:
    post:
      operationId: discardChatRequest
      tags:
      - ChatRequests
      summary: Discard an in-flight creation using its original idempotency key and payload
      description: >-
        Atomically resolve or fence the original creation and apply explicit user Stop.
        Uses the same CreateRequest and clientRequestId, never a new idempotency key.
        No model call is started. Late create replays return the discarded status.
        Existing reserved usage is permanently charged in full; content is deleted and
        the user slot is released independently of background provider termination.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '400':
          description: Sanitized application problem
          content:
            application/json:
              schema:
