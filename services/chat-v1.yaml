      description: 'This GET never prepares, reserves or generates. Another attached
        subscriber is 409. Terminal requests produce a terminal snapshot, without
        replaying deltas. No automatic reconnect. A lost active stream initiates cancellation.
        Cache-Control: no-store; X-Accel-Buffering: no. Status errors before stream
        headers are JSON; errors afterwards are sanitized terminal events when possible.'
      security:
      - browserSession: [
          ]
