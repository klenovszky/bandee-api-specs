schemas:
  AssistantError:
    type: "object"
    properties:
      code:
        type: "string"
      message:
        type: "string"
      text:
        type: "string"
        description: "User-facing text for screen reader / TTS playback"
      correlationId:
        type: "string"
      retryable:
        type: "boolean"
      retryAfterSeconds:
        type: "integer"
        format: "int32"
        minimum: 0
    required:
      - "code"
      - "message"
      - "text"
      - "retryable"
  AssistantContext:
    type: "object"
    properties:
      selectedAccountIds:
        type: "array"
        items:
          type: "string"
          pattern: "^[1-9][0-9]{0,18}$"
        maxItems: 50
        uniqueItems: true
      locale:
        type: "string"
        enum:
          - "hu-HU"
        default: "hu-HU"
      timeZone:
        type: "string"
        maxLength: 100
        default: "Europe/Budapest"
  AssistantConversationRequest:
    type: "object"
    properties:
      title:
        type: "string"
        maxLength: 100
      mode:
        type: "string"
        enum:
          - "REAL"
          - "DEMO"
        default: "REAL"
      context:
        "$ref": "#/schemas/AssistantContext"
  AssistantConversation:
    type: "object"
    properties:
      id:
        type: "string"
        format: "uuid"
      title:
        type: "string"
      mode:
        type: "string"
        enum:
          - "REAL"
          - "DEMO"
        default: "REAL"
      context:
        "$ref": "#/schemas/AssistantContext"
      createdAt:
        type: "string"
        format: "date-time"
      updatedAt:
        type: "string"
        format: "date-time"
      activeRunId:
        type: "string"
        format: "uuid"
    required:
      - "id"
      - "title"
      - "context"
      - "createdAt"
      - "updatedAt"
  AssistantConversationPage:
    type: "object"
    properties:
      items:
        type: "array"
        items:
          "$ref": "#/schemas/AssistantConversation"
      nextCursor:
        type: "string"
    required:
      - "items"
  AssistantMessageRequest:
    type: "object"
    properties:
      clientMessageId:
        type: "string"
        format: "uuid"
      text:
        type: "string"
        minLength: 1
        maxLength: 4000
      context:
        "$ref": "#/schemas/AssistantContext"
    required:
      - "clientMessageId"
      - "text"
  AssistantMessageAccepted:
    type: "object"
    properties:
      messageId:
        type: "string"
        format: "uuid"
      runId:
        type: "string"
        format: "uuid"
    required:
      - "messageId"
      - "runId"
  AssistantEvidence:
    type: "object"
    properties:
      id:
        type: "string"
        format: "uuid"
      title:
        type: "string"
      data:
        "$ref": "../components/analytics.yaml#/schemas/AnalyticsQueryResponse"
    required:
      - "id"
      - "title"
      - "data"
  AssistantTable:
    type: "object"
    properties:
      title:
        type: "string"
      evidenceId:
        type: "string"
        format: "uuid"
    required:
      - "title"
      - "evidenceId"
  AssistantChart:
    type: "object"
    properties:
      title:
        type: "string"
      type:
        type: "string"
        enum:
          - "bar"
          - "line"
      evidenceId:
        type: "string"
        format: "uuid"
      xKey:
        type: "string"
      yKey:
        type: "string"
    required:
      - "title"
      - "type"
      - "evidenceId"
      - "xKey"
      - "yKey"
  AssistantAnswer:
    type: "object"
    properties:
      schemaVersion:
        type: "string"
        enum:
          - "1"
      kind:
        type: "string"
        enum:
          - "ANSWER"
          - "CLARIFICATION"
          - "NO_DATA"
          - "UNSUPPORTED"
      summary:
        type: "string"
      paragraphs:
        type: "array"
        items:
          type: "string"
      evidence:
        type: "array"
        items:
          "$ref": "#/schemas/AssistantEvidence"
      tables:
        type: "array"
        items:
          "$ref": "#/schemas/AssistantTable"
      charts:
        type: "array"
        items:
          "$ref": "#/schemas/AssistantChart"
      warnings:
        type: "array"
        items:
          type: "string"
      suggestedQuestions:
        type: "array"
        items:
          type: "string"
      dataRevision:
        type: "string"
      dataAsOf:
        type: "string"
        format: "date-time"
    required:
      - "schemaVersion"
      - "kind"
      - "summary"
      - "paragraphs"
      - "evidence"
      - "tables"
      - "charts"
      - "warnings"
      - "suggestedQuestions"
  AssistantMessage:
    type: "object"
    properties:
      id:
        type: "string"
        format: "uuid"
      role:
        type: "string"
        enum:
          - "USER"
          - "ASSISTANT"
      text:
        type: "string"
      createdAt:
        type: "string"
        format: "date-time"
      runId:
        type: "string"
        format: "uuid"
      answer:
        "$ref": "#/schemas/AssistantAnswer"
      stale:
        type: "boolean"
    required:
      - "id"
      - "role"
      - "text"
      - "createdAt"
      - "stale"
  AssistantMessagePage:
    type: "object"
    properties:
      items:
        type: "array"
        items:
          "$ref": "#/schemas/AssistantMessage"
      nextCursor:
        type: "string"
    required:
      - "items"
  AssistantRun:
    type: "object"
    properties:
      id:
        type: "string"
        format: "uuid"
      conversationId:
        type: "string"
        format: "uuid"
      status:
        type: "string"
        enum:
          - "QUEUED"
          - "RUNNING"
          - "COMPLETED"
          - "FAILED"
          - "CANCELLED"
          - "EXPIRED"
      createdAt:
        type: "string"
        format: "date-time"
      updatedAt:
        type: "string"
        format: "date-time"
      result:
        "$ref": "#/schemas/AssistantAnswer"
      error:
        "$ref": "#/schemas/AssistantError"
      stale:
        type: "boolean"
      modelCalls:
        type: "integer"
        format: "int32"
        minimum: 0
      toolCalls:
        type: "integer"
        format: "int32"
        minimum: 0
    required:
      - "id"
      - "conversationId"
      - "status"
      - "createdAt"
      - "updatedAt"
      - "stale"
      - "modelCalls"
      - "toolCalls"
