schemas:
  AnalyticsPeriod:
    type: "object"
    properties:
      from:
        type: "string"
        format: "date"
      toExclusive:
        type: "string"
        format: "date"
    required:
      - "from"
      - "toExclusive"
  AnalyticsQueryRequest:
    type: "object"
    properties:
      expectedRevision:
        type: "string"
        maxLength: 50
      accountIds:
        type: "array"
        items:
          type: "string"
          pattern: "^[1-9][0-9]{0,18}$"
        maxItems: 50
        uniqueItems: true
      period:
        "$ref": "#/schemas/AnalyticsPeriod"
      comparisonPeriod:
        "$ref": "#/schemas/AnalyticsPeriod"
      groupBy:
        type: "string"
        enum:
          - "NONE"
          - "DAY"
          - "MONTH"
          - "PARTNER"
      direction:
        type: "string"
        enum:
          - "ALL"
          - "DEBIT"
          - "CREDIT"
      currency:
        type: "string"
        pattern: "^[A-Z]{3}$"
      search:
        type: "string"
        maxLength: 200
      limit:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 50
        default: 20
    required:
      - "period"
  AnalyticsAccount:
    type: "object"
    properties:
      id:
        type: "string"
        pattern: "^[1-9][0-9]{0,18}$"
      label:
        type: "string"
      currency:
        type: "string"
      lastSyncedAt:
        type: "string"
        format: "date-time"
    required:
      - "id"
      - "label"
      - "currency"
  AnalyticsContextResponse:
    type: "object"
    properties:
      revision:
        type: "string"
      dataAsOf:
        type: "string"
        format: "date-time"
      accounts:
        type: "array"
        items:
          "$ref": "#/schemas/AnalyticsAccount"
      capabilities:
        type: "array"
        items:
          type: "string"
      warnings:
        type: "array"
        items:
          type: "string"
    required:
      - "revision"
      - "accounts"
      - "capabilities"
      - "warnings"
  AnalyticsColumn:
    type: "object"
    properties:
      key:
        type: "string"
      label:
        type: "string"
      type:
        type: "string"
        enum:
          - "TEXT"
          - "MONEY"
          - "COUNT"
          - "DATE"
          - "PERCENT"
    required:
      - "key"
      - "label"
      - "type"
  AnalyticsRow:
    type: "object"
    additionalProperties:
      type: "string"
  AnalyticsQueryResponse:
    type: "object"
    properties:
      revision:
        type: "string"
      queriedAt:
        type: "string"
        format: "date-time"
      dataAsOf:
        type: "string"
        format: "date-time"
      query:
        "$ref": "#/schemas/AnalyticsQueryRequest"
      columns:
        type: "array"
        items:
          "$ref": "#/schemas/AnalyticsColumn"
      rows:
        type: "array"
        items:
          "$ref": "#/schemas/AnalyticsRow"
      transactionCount:
        type: "integer"
        format: "int32"
        minimum: 0
      totalGroups:
        type: "integer"
        format: "int32"
        minimum: 0
      truncated:
        type: "boolean"
      warnings:
        type: "array"
        items:
          type: "string"
    required:
      - "revision"
      - "queriedAt"
      - "query"
      - "columns"
      - "rows"
      - "transactionCount"
      - "totalGroups"
      - "truncated"
      - "warnings"
  AnalyticsTransactionSearchRequest:
    type: "object"
    properties:
      query:
        "$ref": "#/schemas/AnalyticsQueryRequest"
      cursor:
        type: "string"
        maxLength: 100
      limit:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 50
        default: 20
    required:
      - "query"
  AnalyticsTransaction:
    type: "object"
    properties:
      id:
        type: "string"
        pattern: "^[1-9][0-9]{0,18}$"
      accountId:
        type: "string"
        pattern: "^[1-9][0-9]{0,18}$"
      amount:
        type: "string"
        pattern: "^-?[0-9]+(?:\\.[0-9]{1,4})?$"
      currency:
        type: "string"
      bookingDate:
        type: "string"
        format: "date"
      partner:
        type: "string"
      description:
        type: "string"
      status:
        type: "string"
    required:
      - "id"
      - "accountId"
      - "amount"
      - "currency"
      - "bookingDate"
  AnalyticsTransactionPage:
    type: "object"
    properties:
      revision:
        type: "string"
      items:
        type: "array"
        items:
          "$ref": "#/schemas/AnalyticsTransaction"
      nextCursor:
        type: "string"
    required:
      - "revision"
      - "items"
